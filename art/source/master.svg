    <!--d--><circle cx="512" cy="800" r="408" fill="none" stroke="#fff" stroke-width="3" opacity=".35"/><!--/d-->

    <!-- hills -->
    <path d="M64 772 C214 700 384 708 516 768 C660 706 832 690 960 752 L960 960 L64 960 Z" fill="url(#hillBack)"/>
    <path d="M64 842 C262 786 762 786 960 842 L960 960 L64 960 Z" fill="url(#hillFront)"/>
    <path d="M64 842 C262 786 762 786 960 842" fill="none" stroke="#c4f5a8" stroke-width="5" opacity=".6"/>
<!--d-->    <!-- tiny flowers -->
    <g>
      <g transform="translate(176 878)"><circle r="13" cx="0" cy="-12" fill="#fff"/><circle r="13" cx="11" cy="-3" fill="#fff"/><circle r="13" cx="7" cy="10" fill="#fff"/><circle r="13" cx="-7" cy="10" fill="#fff"/><circle r="13" cx="-11" cy="-3" fill="#fff"/><circle r="8" fill="#ffd23f"/></g>
      <g transform="translate(250 912) scale(.8)"><circle r="13" cx="0" cy="-12" fill="#ff9ec4"/><circle r="13" cx="11" cy="-3" fill="#ff9ec4"/><circle r="13" cx="7" cy="10" fill="#ff9ec4"/><circle r="13" cx="-7" cy="10" fill="#ff9ec4"/><circle r="13" cx="-11" cy="-3" fill="#ff9ec4"/><circle r="8" fill="#fff3b0"/></g>
      <g transform="translate(838 884) scale(.9)"><circle r="13" cx="0" cy="-12" fill="#ffe27a"/><circle r="13" cx="11" cy="-3" fill="#ffe27a"/><circle r="13" cx="7" cy="10" fill="#ffe27a"/><circle r="13" cx="-7" cy="10" fill="#ffe27a"/><circle r="13" cx="-11" cy="-3" fill="#ffe27a"/><circle r="8" fill="#ff8a3d"/></g>
      <g transform="translate(770 922) scale(.7)"><circle r="13" cx="0" cy="-12" fill="#fff"/><circle r="13" cx="11" cy="-3" fill="#fff"/><circle r="13" cx="7" cy="10" fill="#fff"/><circle r="13" cx="-7" cy="10" fill="#fff"/><circle r="13" cx="-11" cy="-3" fill="#fff"/><circle r="8" fill="#ffd23f"/></g>
    </g>
<!--/d-->
    <!-- the pot's shadow -->
    <ellipse cx="512" cy="888" rx="214" ry="30" fill="#1d6a3e" opacity=".4"/>

    <!-- pot body -->
    <path d="M340 636 L684 636 L648 862 Q644 890 616 890 L408 890 Q380 890 376 862 Z" fill="url(#pot)"/>
    <path d="M340 636 L684 636 L648 862 Q644 890 616 890 L408 890 Q380 890 376 862 Z" fill="url(#potShade)"/>
    <!--d--><path d="M378 690 L394 840" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".2"/><!--/d-->
    <path d="M340 636 L684 636 L678 672 L346 672 Z" fill="#8f3720" opacity=".32"/>

    <!-- rim with soil inside -->
    <rect x="312" y="580" width="400" height="76" rx="30" fill="url(#rim)"/>
    <ellipse cx="512" cy="582" rx="190" ry="24" fill="#ffbe94"/>
    <ellipse cx="512" cy="584" rx="166" ry="16" fill="#6b3426"/>
    <ellipse cx="512" cy="588" rx="150" ry="10" fill="#4e2419"/>
