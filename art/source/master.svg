    <path d="M510 394 C580 290 672 244 772 252 Q634 310 510 394 Z" fill="url(#leafHi)"/>
    <!--d--><path d="M532 362 C590 296 668 260 750 256" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/><!--/d-->
    <!--d--><ellipse cx="690" cy="300" rx="11" ry="13" fill="#fff" opacity=".75"/>
    <circle cx="686" cy="295" r="4" fill="#fff"/><!--/d-->
    <!-- new leaf on top -->
    <path d="M506 380 C484 326 496 278 534 242 C556 296 546 348 506 380 Z" fill="url(#leafHi)"/>
    <path d="M506 380 C520 330 528 290 534 242 C556 296 546 348 506 380 Z" fill="#4cc56a" opacity=".55"/>

    <!-- face -->
    <ellipse cx="402" cy="800" rx="36" ry="21" fill="#ff5f93" opacity=".5"/>
    <ellipse cx="622" cy="800" rx="36" ry="21" fill="#ff5f93" opacity=".5"/>
    <ellipse cx="450" cy="748" rx="26" ry="34" fill="#3a1d2c"/>
    <ellipse cx="574" cy="748" rx="26" ry="34" fill="#3a1d2c"/>
    <circle cx="459" cy="735" r="10" fill="#fff"/>
    <circle cx="583" cy="735" r="10" fill="#fff"/>
    <!--d--><circle cx="443" cy="762" r="5" fill="#fff" opacity=".85"/>
    <circle cx="567" cy="762" r="5" fill="#fff" opacity=".85"/><!--/d-->
    <path d="M480 786 C488 832 536 832 544 786 Z" fill="#3a1d2c"/>
    <g clip-path="url(#mouth)"><ellipse cx="512" cy="826" rx="22" ry="14" fill="#ff7a96"/></g>
    <path d="M480 786 L544 786" stroke="#3a1d2c" stroke-width="8" stroke-linecap="round"/>

    <!-- sparkles: gold for Gold, white for the stars -->
    <circle cx="232" cy="520" r="54" fill="url(#glow)"/>
    <path d="M232 470 Q236 516 282 520 Q236 524 232 570 Q228 524 182 520 Q228 516 232 470 Z" fill="#ffe27a"/>
    <path d="M800 462 Q803 497 838 500 Q803 503 800 538 Q797 503 762 500 Q797 497 800 462 Z" fill="#fff"/>
    <!--d--><path d="M174 640 Q176 660 196 662 Q176 664 174 684 Q172 664 152 662 Q172 660 174 640 Z" fill="#fff" opacity=".8"/><!--/d-->

    <rect x="64" y="64" width="896" height="896" fill="url(#gloss)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#vignette)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="4"/>
</svg>
