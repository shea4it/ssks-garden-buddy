<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="64" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f3bc9"/>
      <stop offset="0.38" stop-color="#9a58d6"/>
      <stop offset="0.66" stop-color="#ff86ae"/>
      <stop offset="0.9" stop-color="#ffc38a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="512" cy="470" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#1b0f3a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b0f3a" stop-opacity=".28"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="64" x2="0" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="700" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4cc073"/>
      <stop offset="1" stop-color="#2a8a57"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="790" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ae37f"/>
      <stop offset="1" stop-color="#3eab5f"/>
    </linearGradient>
    <linearGradient id="pot" x1="340" y1="0" x2="690" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa16e"/>
      <stop offset="0.5" stop-color="#f07446"/>
      <stop offset="1" stop-color="#c94f30"/>
    </linearGradient>
    <linearGradient id="potShade" x1="0" y1="660" x2="0" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#7a2a1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a2a1a" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="rim" x1="312" y1="0" x2="712" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb07f"/>
      <stop offset="0.55" stop-color="#f8834f"/>
      <stop offset="1" stop-color="#d65c38"/>
    </linearGradient>
    <linearGradient id="leafLo" x1="0" y1="250" x2="0" y2="450" gradientUnits="userSpaceOnUse">
