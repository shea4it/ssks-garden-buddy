      <stop offset="1" stop-color="#23994f"/>
    </linearGradient>
    <linearGradient id="leafHi" x1="0" y1="250" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2ffb4"/>
      <stop offset="1" stop-color="#6fdc78"/>
    </linearGradient>
    <linearGradient id="stem" x1="490" y1="0" x2="530" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cd176"/>
      <stop offset="1" stop-color="#249a50"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6c4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <clipPath id="mouth"><path d="M480 786 C488 832 536 832 544 786 Z"/></clipPath>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0.5" stop-color="#ffd98c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffd98c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#sky)"/>

    <!-- stars and a little amber moon -->
<!--d-->    <g fill="#fff">
      <circle cx="196" cy="214" r="7" opacity=".85"/>
      <circle cx="268" cy="140" r="4" opacity=".6"/>
      <circle cx="708" cy="132" r="5" opacity=".7"/>
      <circle cx="150" cy="372" r="4" opacity=".5"/>
      <circle cx="884" cy="338" r="5" opacity=".55"/>
      <circle cx="610" cy="186" r="3.5" opacity=".55"/>
    </g>
<!--/d-->    <!--d--><circle cx="822" cy="202" r="66" fill="url(#moonGlow)"/><!--/d-->
    <path d="M858 152 A56 56 0 1 0 870 246 A46 46 0 1 1 858 152 Z" fill="#ffd98c"/>

    <!-- rainbow, with a soft glow behind it -->
    <g fill="none" stroke-width="28" filter="url(#blur18)" opacity=".55">
      <circle cx="512" cy="800" r="396" stroke="#ff6b6b"/>
      <circle cx="512" cy="800" r="284" stroke="#9775fa"/>
    </g>
    <g fill="none" stroke-width="25">
      <circle cx="512" cy="800" r="396" stroke="#ff6b6b"/>
      <circle cx="512" cy="800" r="372" stroke="#ff9f43"/>
      <circle cx="512" cy="800" r="348" stroke="#ffd93d"/>
      <circle cx="512" cy="800" r="324" stroke="#6bdb6f"/>
      <circle cx="512" cy="800" r="300" stroke="#45a8f5"/>
