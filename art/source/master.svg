    <!--d--><path d="M504 560 C501 500 494 450 498 400" fill="none" stroke="#b9f5a8" stroke-width="6" stroke-linecap="round" opacity=".5"/><!--/d-->
    <!-- left leaf: lower half, then the lit upper half, then a rim of light -->
    <path d="M506 434 C470 352 380 286 258 292 C292 396 402 466 506 434 Z" fill="url(#leafLo)"/>
    <path d="M506 434 C470 352 380 286 258 292 Q392 356 506 434 Z" fill="url(#leafHi)"/>
    <!--d--><path d="M490 404 C456 346 382 300 280 296" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/><!--/d-->
    <!-- right leaf -->
